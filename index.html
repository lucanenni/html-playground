<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML Playground — editor live</title>
<style>
/* ══ temi highlight.js (scoped per tema) ══ */
/* dracula */
.editor-wrap:not([class*="theme-"]) .hljs { display: block; overflow-x: auto; padding: 0.5em; background: #282a36; }
.editor-wrap:not([class*="theme-"]) .hljs-keyword,
.editor-wrap:not([class*="theme-"]) .hljs-selector-tag,
.editor-wrap:not([class*="theme-"]) .hljs-literal,
.editor-wrap:not([class*="theme-"]) .hljs-section,
.editor-wrap:not([class*="theme-"]) .hljs-link { color: #8be9fd; }
.editor-wrap:not([class*="theme-"]) .hljs-function .hljs-keyword { color: #ff79c6; }
.editor-wrap:not([class*="theme-"]) .hljs,
.editor-wrap:not([class*="theme-"]) .hljs-subst { color: #f8f8f2; }
.editor-wrap:not([class*="theme-"]) .hljs-string,
.editor-wrap:not([class*="theme-"]) .hljs-title,
.editor-wrap:not([class*="theme-"]) .hljs-name,
.editor-wrap:not([class*="theme-"]) .hljs-type,
.editor-wrap:not([class*="theme-"]) .hljs-attribute,
.editor-wrap:not([class*="theme-"]) .hljs-symbol,
.editor-wrap:not([class*="theme-"]) .hljs-bullet,
.editor-wrap:not([class*="theme-"]) .hljs-addition,
.editor-wrap:not([class*="theme-"]) .hljs-variable,
.editor-wrap:not([class*="theme-"]) .hljs-template-tag,
.editor-wrap:not([class*="theme-"]) .hljs-template-variable { color: #f1fa8c; }
.editor-wrap:not([class*="theme-"]) .hljs-comment,
.editor-wrap:not([class*="theme-"]) .hljs-quote,
.editor-wrap:not([class*="theme-"]) .hljs-deletion,
.editor-wrap:not([class*="theme-"]) .hljs-meta { color: #6272a4; }
.editor-wrap:not([class*="theme-"]) .hljs-keyword,
.editor-wrap:not([class*="theme-"]) .hljs-selector-tag,
.editor-wrap:not([class*="theme-"]) .hljs-literal,
.editor-wrap:not([class*="theme-"]) .hljs-title,
.editor-wrap:not([class*="theme-"]) .hljs-section,
.editor-wrap:not([class*="theme-"]) .hljs-doctag,
.editor-wrap:not([class*="theme-"]) .hljs-type,
.editor-wrap:not([class*="theme-"]) .hljs-name,
.editor-wrap:not([class*="theme-"]) .hljs-strong { font-weight: bold; }
.editor-wrap:not([class*="theme-"]) .hljs-emphasis { font-style: italic; }

/* atom */
.theme-atom .hljs { display: block; overflow-x: auto; padding: 0.5em; color: #abb2bf; background: #282c34; }
.theme-atom .hljs-comment,
.theme-atom .hljs-quote { color: #5c6370; font-style: italic; }
.theme-atom .hljs-doctag,
.theme-atom .hljs-keyword,
.theme-atom .hljs-formula { color: #c678dd; }
.theme-atom .hljs-section,
.theme-atom .hljs-name,
.theme-atom .hljs-selector-tag,
.theme-atom .hljs-deletion,
.theme-atom .hljs-subst { color: #e06c75; }
.theme-atom .hljs-literal { color: #56b6c2; }
.theme-atom .hljs-string,
.theme-atom .hljs-regexp,
.theme-atom .hljs-addition,
.theme-atom .hljs-attribute,
.theme-atom .hljs-meta-string { color: #98c379; }
.theme-atom .hljs-built_in,
.theme-atom .hljs-class .theme-atom .hljs-title { color: #e6c07b; }
.theme-atom .hljs-attr,
.theme-atom .hljs-variable,
.theme-atom .hljs-template-variable,
.theme-atom .hljs-type,
.theme-atom .hljs-selector-class,
.theme-atom .hljs-selector-attr,
.theme-atom .hljs-selector-pseudo,
.theme-atom .hljs-number { color: #d19a66; }
.theme-atom .hljs-symbol,
.theme-atom .hljs-bullet,
.theme-atom .hljs-link,
.theme-atom .hljs-meta,
.theme-atom .hljs-selector-id,
.theme-atom .hljs-title { color: #61aeee; }
.theme-atom .hljs-emphasis { font-style: italic; }
.theme-atom .hljs-strong { font-weight: bold; }
.theme-atom .hljs-link { text-decoration: underline; }

/* github */
.theme-github .hljs { display: block; overflow-x: auto; padding: 0.5em; color: #333; background: #f8f8f8; }
.theme-github .hljs-comment,
.theme-github .hljs-quote { color: #998; font-style: italic; }
.theme-github .hljs-keyword,
.theme-github .hljs-selector-tag,
.theme-github .hljs-subst { color: #333; font-weight: bold; }
.theme-github .hljs-number,
.theme-github .hljs-literal,
.theme-github .hljs-variable,
.theme-github .hljs-template-variable,
.theme-github .hljs-attr { color: #008080; }
.theme-github .hljs-string,
.theme-github .hljs-doctag { color: #d14; }
.theme-github .hljs-title,
.theme-github .hljs-section,
.theme-github .hljs-selector-id { color: #900; font-weight: bold; }
.theme-github .hljs-subst { font-weight: normal; }
.theme-github .hljs-type,
.theme-github .hljs-class .theme-github .hljs-title { color: #458; font-weight: bold; }
.theme-github .hljs-tag,
.theme-github .hljs-name,
.theme-github .hljs-attribute { color: #000080; font-weight: normal; }
.theme-github .hljs-regexp,
.theme-github .hljs-link { color: #009926; }
.theme-github .hljs-symbol,
.theme-github .hljs-bullet { color: #990073; }
.theme-github .hljs-built_in,
.theme-github .hljs-builtin-name { color: #0086b3; }
.theme-github .hljs-meta { color: #999; font-weight: bold; }
.theme-github .hljs-deletion { background: #fdd; }
.theme-github .hljs-addition { background: #dfd; }
.theme-github .hljs-emphasis { font-style: italic; }
.theme-github .hljs-strong { font-weight: bold; }

/* monokai */
.theme-monokai .hljs { display: block; overflow-x: auto; padding: 0.5em; background: #23241f; }
.theme-monokai .hljs,
.theme-monokai .hljs-tag,
.theme-monokai .hljs-subst { color: #f8f8f2; }
.theme-monokai .hljs-strong,
.theme-monokai .hljs-emphasis { color: #a8a8a2; }
.theme-monokai .hljs-bullet,
.theme-monokai .hljs-quote,
.theme-monokai .hljs-number,
.theme-monokai .hljs-regexp,
.theme-monokai .hljs-literal,
.theme-monokai .hljs-link { color: #ae81ff; }
.theme-monokai .hljs-code,
.theme-monokai .hljs-title,
.theme-monokai .hljs-section,
.theme-monokai .hljs-selector-class { color: #a6e22e; }
.theme-monokai .hljs-strong { font-weight: bold; }
.theme-monokai .hljs-emphasis { font-style: italic; }
.theme-monokai .hljs-keyword,
.theme-monokai .hljs-selector-tag,
.theme-monokai .hljs-name,
.theme-monokai .hljs-attr { color: #f92672; }
.theme-monokai .hljs-symbol,
.theme-monokai .hljs-attribute { color: #66d9ef; }
.theme-monokai .hljs-params,
.theme-monokai .hljs-class .theme-monokai .hljs-title { color: #f8f8f2; }
.theme-monokai .hljs-string,
.theme-monokai .hljs-type,
.theme-monokai .hljs-built_in,
.theme-monokai .hljs-builtin-name,
.theme-monokai .hljs-selector-id,
.theme-monokai .hljs-selector-attr,
.theme-monokai .hljs-selector-pseudo,
.theme-monokai .hljs-addition,
.theme-monokai .hljs-variable,
.theme-monokai .hljs-template-variable { color: #e6db74; }
.theme-monokai .hljs-comment,
.theme-monokai .hljs-deletion,
.theme-monokai .hljs-meta { color: #75715e; }

/* ══ reset & variabili ══ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root {
  --bg:        #0e1117;
  --surface:   #161b27;
  --panel:     #1c2333;
  --border:    #2a3449;
  --accent:    #4ade80;
  --accent2:   #38bdf8;
  --text:      #e2e8f0;
  --muted:     #64748b;
  --tab-h:     42px;
  --toolbar-h: 52px;
  --font-mono: "Courier New", Courier, monospace;
  --radius:    6px;
  --editor-fs: 13px;
  --editor-bg: #282a36;
  --editor-gutter: #21222c;
  --editor-gutter-border: #3d4059;
  --editor-fg: #f8f8f2;
  --editor-comment: #6272a4;
}
/* sovrascritture variabili per tema chiaro */
.theme-github {
  --editor-bg: #f8f8f8;
  --editor-gutter: #efefef;
  --editor-gutter-border: #ddd;
  --editor-fg: #333;
  --editor-comment: #998;
}

html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--font-mono);display:flex;flex-direction:column}

/* ── toolbar ── */
#toolbar{height:var(--toolbar-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:9px;flex-shrink:0;z-index:10;overflow-x:auto;overflow-y:hidden}
#toolbar::-webkit-scrollbar{height:0}
.logo{font-size:17px;font-weight:700;letter-spacing:-.5px;color:var(--accent);margin-right:2px;white-space:nowrap}
.logo span{color:var(--text)}
.sep{width:1px;height:24px;background:var(--border);flex-shrink:0}
.layout-btn{background:transparent;border:1px solid var(--border);border-radius:var(--radius);color:var(--muted);cursor:pointer;padding:5px 8px;display:flex;align-items:center;gap:4px;font-size:11px;transition:all .15s;flex-shrink:0}
.layout-btn:hover,.layout-btn.active{border-color:var(--accent2);color:var(--accent2);background:rgba(56,189,248,.08)}
.layout-btn svg{width:16px;height:16px}
.btn{background:transparent;border:1px solid var(--border);border-radius:var(--radius);color:var(--text);cursor:pointer;padding:5px 12px;font-size:12px;font-family:var(--font-mono);transition:all .15s;white-space:nowrap;flex-shrink:0}
.btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(74,222,128,.07)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#0a1a0e;font-weight:700}
.btn.primary:hover{background:#86efac;border-color:#86efac}
.spacer{flex:1;min-width:6px}

/* font size */
.fs-control{display:flex;align-items:center;gap:7px;flex-shrink:0;border:1px solid var(--border);border-radius:var(--radius);padding:4px 10px;background:var(--panel)}
.fs-label{font-size:10px;color:var(--muted);white-space:nowrap;letter-spacing:.04em}
.fs-value{font-size:11px;color:var(--accent2);font-weight:700;min-width:26px;text-align:right}
#fs-slider{-webkit-appearance:none;appearance:none;width:72px;height:3px;border-radius:2px;background:var(--border);outline:none;cursor:pointer}
#fs-slider::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--accent2);cursor:pointer}
#fs-slider::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--accent2);border:none;cursor:pointer}

/* tema selector */
.theme-select{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:var(--font-mono);font-size:11px;padding:4px 8px;cursor:pointer;flex-shrink:0}
.theme-select:focus{outline:none;border-color:var(--accent2)}

/* autorun */
.autorun-wrap{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);cursor:pointer;flex-shrink:0}
.autorun-wrap input{accent-color:var(--accent);cursor:pointer}

/* dropdown */
.dl-group{position:relative;flex-shrink:0}
.dl-menu{display:none;position:absolute;top:calc(100% + 6px);right:0;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);min-width:170px;z-index:200;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.dl-menu.open{display:block}
.dl-item{display:block;width:100%;padding:9px 14px;background:transparent;border:none;color:var(--text);font-family:var(--font-mono);font-size:12px;text-align:left;cursor:pointer;transition:background .1s}
.dl-item:hover{background:var(--border);color:var(--accent)}
.dl-item .tag{font-size:10px;background:var(--border);border-radius:3px;padding:1px 5px;margin-left:6px;color:var(--muted)}

/* ── main ── */
#main{flex:1;display:flex;overflow:hidden;min-height:0}
#editors{display:flex;flex-direction:column;overflow:hidden;background:var(--bg);min-width:0;min-height:0}
#main.layout-h{flex-direction:row}
#main.layout-h #editors{flex-direction:row;flex:1}
#main.layout-v{flex-direction:column}
#main.layout-v #editors{flex-direction:row;height:50%;flex:none;width:100%;border-bottom:2px solid var(--border)}
#main.layout-v #preview-wrap{height:50%;flex:none;width:100%}

.editor-pane{display:flex;flex-direction:column;flex:1;min-width:0;min-height:0;border-right:1px solid var(--border);overflow:hidden}
.editor-pane:last-child{border-right:none}
#main.layout-v .editor-pane{border-right:none;border-bottom:1px solid var(--border)}
#main.layout-v .editor-pane:last-child{border-bottom:none}

.pane-header{height:var(--tab-h);display:flex;align-items:center;padding:0 14px;gap:8px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0}
.lang-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.dot-html{background:#f97316}.dot-css{background:var(--accent2)}.dot-js{background:#facc15}
.pane-title{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;flex:1}
.line-count{font-size:10px;color:var(--muted)}

/* editor */
.editor-wrap{flex:1;position:relative;overflow:hidden;min-height:0;background:var(--editor-bg)}
.code-input{position:absolute;inset:0;width:100%;height:100%;resize:none;border:none;outline:none;background:transparent;color:transparent;caret-color:var(--editor-fg);font-family:var(--font-mono);font-size:var(--editor-fs);line-height:1.65;padding:12px 12px 12px 56px;tab-size:2;overflow:auto;white-space:pre;z-index:2}
.code-highlight{position:absolute;inset:0;margin:0;font-family:var(--font-mono);font-size:var(--editor-fs);line-height:1.65;padding:12px 12px 12px 56px;overflow:auto;pointer-events:none;white-space:pre;word-wrap:normal;z-index:1;background:var(--editor-bg);color:var(--editor-fg)}
.line-nums{position:absolute;top:0;left:0;width:46px;height:100%;overflow:hidden;background:var(--editor-gutter);border-right:1px solid var(--editor-gutter-border);padding:12px 0;z-index:3;pointer-events:none}
.line-nums span{display:block;text-align:right;padding-right:10px;font-family:var(--font-mono);font-size:var(--editor-fs);line-height:1.65;color:var(--editor-comment);user-select:none}
.active-line-hl{position:absolute;left:46px;right:0;background:rgba(255,255,255,.04);pointer-events:none;z-index:1}
.code-highlight code.hljs{display:block;background:transparent;padding:0;overflow:visible;font-size:inherit;line-height:inherit;font-family:inherit;color:var(--editor-fg)}

/* ── pannello errori ── */
#error-panel{flex-shrink:0;background:#1a0a0a;border-top:2px solid #ef4444;font-family:var(--font-mono);font-size:11px;overflow-y:auto;transition:height .2s;height:0}
#error-panel.has-errors{height:110px}
#error-header{display:flex;align-items:center;gap:8px;padding:4px 12px;background:#2a0f0f;border-bottom:1px solid #3d1515;flex-shrink:0}
.err-title{font-size:11px;font-weight:700;color:#ef4444;letter-spacing:.04em;flex:1}
.err-count{background:#ef4444;color:#fff;font-size:10px;font-weight:700;border-radius:10px;padding:1px 7px}
#error-list{padding:6px 12px;display:flex;flex-direction:column;gap:4px}
.err-item{display:flex;gap:8px;align-items:flex-start;color:#fca5a5}
.err-icon{color:#ef4444;flex-shrink:0}
.err-msg{flex:1;word-break:break-all}
.err-line{color:#f97316;flex-shrink:0;font-weight:700}
#error-panel.no-errors-flash{animation:flash-ok .4s}
@keyframes flash-ok{0%{background:#0a1a0a}100%{background:#1a0a0a}}

/* preview */
#right-col{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#preview-wrap{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#preview-header{height:var(--tab-h);background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:8px;flex-shrink:0}
.preview-dots{display:flex;gap:6px}
.preview-dots span{width:10px;height:10px;border-radius:50%}
.pd-r{background:#ef4444}.pd-y{background:#f59e0b}.pd-g{background:var(--accent)}
#preview-title{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);flex:1}
#preview-frame{flex:1;border:none;background:#fff}

/* status bar */
#statusbar{height:24px;background:var(--accent);display:flex;align-items:center;padding:0 12px;gap:16px;flex-shrink:0}
.sb-item{font-size:10px;color:#0a1a0e;font-weight:600;letter-spacing:.04em}
#sb-indicator{width:7px;height:7px;border-radius:50%;background:#0a1a0e;animation:pulse 2s ease infinite}
#sb-save{font-size:10px;color:#0a1a0e;opacity:.7}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* resize */
.resize-handle{width:4px;background:var(--border);cursor:col-resize;flex-shrink:0;transition:background .15s;z-index:5}
.resize-handle:hover{background:var(--accent2)}
#main.layout-v .resize-handle{display:none}

/* toast */
#toast{position:fixed;bottom:36px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--accent);color:#0a1a0e;font-size:12px;font-weight:700;padding:8px 20px;border-radius:20px;opacity:0;transition:all .3s;pointer-events:none;z-index:9999}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--editor-gutter)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--muted)}
</style>
</head>
<body>

<div id="toolbar">
  <div class="logo">HTML<span>Playground</span></div>
  <div class="sep"></div>

  <button class="layout-btn active" id="btn-layout-h" title="Affiancato" onclick="setLayout('h')">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
      <rect x="1" y="1" width="6" height="14" rx="1"/><rect x="9" y="1" width="6" height="14" rx="1"/>
    </svg>
  </button>
  <button class="layout-btn" id="btn-layout-v" title="Editors sopra / anteprima sotto" onclick="setLayout('v')">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
      <rect x="1" y="1" width="14" height="6" rx="1"/><rect x="1" y="9" width="14" height="6" rx="1"/>
    </svg>
  </button>

  <div class="sep"></div>
  <button class="btn primary" onclick="runPreview()">&#9654; esegui</button>
  <label class="autorun-wrap"><input type="checkbox" id="autorun" checked> auto</label>
  <div class="sep"></div>

  <!-- font size -->
  <div class="fs-control" title="Dimensione carattere negli editor">
    <span class="fs-label">testo</span>
    <input type="range" id="fs-slider" min="10" max="26" value="13" step="1">
    <span class="fs-value" id="fs-val">13px</span>
  </div>

  <!-- tema -->
  <select class="theme-select" id="theme-select" title="Tema colori editor" onchange="applyTheme(this.value)">
    <option value="dracula">&#127754; Dracula</option>
    <option value="atom">&#127761; Atom Dark</option>
    <option value="monokai">&#127754; Monokai</option>
    <option value="github">&#9728; GitHub (chiaro)</option>
  </select>

  <div class="spacer"></div>

  <!-- formato -->
  <button class="btn" onclick="formatAll()" title="Formatta il codice (Alt+Shift+F)">&#10097;&#10095; formatta</button>

  <div class="dl-group">
    <button class="btn" onclick="toggleDlMenu()">&#8595; scarica &#9660;</button>
    <div class="dl-menu" id="dl-menu">
      <button class="dl-item" onclick="downloadFile('html')">index.html <span class="tag">HTML</span></button>
      <button class="dl-item" onclick="downloadFile('css')">style.css <span class="tag">CSS</span></button>
      <button class="dl-item" onclick="downloadFile('js')">script.js <span class="tag">JS</span></button>
      <button class="dl-item" onclick="downloadFile('all')">tutto in un HTML <span class="tag">unico</span></button>
      <button class="dl-item" onclick="downloadZip()">&#128230; scarica ZIP</button>
    </div>
  </div>
  <button class="btn" onclick="insertSkeleton()" title="Inserisce la struttura base di una pagina HTML">&#9783; struttura base</button>
  <button class="btn" onclick="clearAll()">&#x2715; pulisci</button>
</div>

<div id="main" class="layout-h">
  <div id="editors">

    <div class="editor-pane" id="pane-html">
      <div class="pane-header">
        <span class="lang-dot dot-html"></span>
        <span class="pane-title">HTML</span>
        <span class="line-count" id="lc-html">&#8211;</span>
      </div>
      <div class="editor-wrap" id="wrap-html">
        <div class="line-nums" id="ln-html"></div>
        <div class="active-line-hl" id="alh-html"></div>
        <pre class="code-highlight" id="hi-html"><code class="hljs"></code></pre>
        <textarea class="code-input" id="ed-html" spellcheck="false" autocorrect="off" autocapitalize="off"></textarea>
      </div>
    </div>

    <div class="editor-pane" id="pane-css">
      <div class="pane-header">
        <span class="lang-dot dot-css"></span>
        <span class="pane-title">CSS</span>
        <span class="line-count" id="lc-css">&#8211;</span>
      </div>
      <div class="editor-wrap" id="wrap-css">
        <div class="line-nums" id="ln-css"></div>
        <div class="active-line-hl" id="alh-css"></div>
        <pre class="code-highlight" id="hi-css"><code class="hljs"></code></pre>
        <textarea class="code-input" id="ed-css" spellcheck="false" autocorrect="off" autocapitalize="off"></textarea>
      </div>
    </div>

    <div class="editor-pane" id="pane-js">
      <div class="pane-header">

/* ══ SYNTAX HIGHLIGHT ══ */
function syncHighlight(e) {
  let html;
  try {
    html = hljs.highlight(e.ta.value, { language: e.lang, ignoreIllegals: true }).value;
  } catch(_) {
    html = e.ta.value.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  e.hi.innerHTML = html;
}

function syncLineNums(e) {
  const n = e.ta.value.split('\n').length;
  let s = '';
  for (let i = 1; i <= n; i++) s += '<span>' + i + '</span>';
  e.ln.innerHTML = s;
}

function syncScroll(e) {
  e.pre.scrollTop  = e.ta.scrollTop;
  e.pre.scrollLeft = e.ta.scrollLeft;
  e.ln.scrollTop   = e.ta.scrollTop;
  updateActiveLine(e);
}

function updateActiveLine(e) {
  const ta    = e.ta;
  const lineH = parseFloat(getComputedStyle(ta).lineHeight) || 21.45;
  const line  = ta.value.substring(0, ta.selectionStart).split('\n').length;
  e.alh.style.top     = (12 + (line - 1) * lineH - ta.scrollTop) + 'px';
  e.alh.style.height  = lineH + 'px';
  e.alh.style.display = 'block';
}

function updateLC(id, ta) {
  const n = ta.value.split('\n').length;
  document.getElementById('lc-' + id).textContent = n + (n === 1 ? ' riga' : ' righe');
}

/* ══ TASTIERA ══ */
function handleKey(ev, ed) {
  const ta = ed.ta;

  // Alt+Shift+F → formatta
  if (ev.altKey && ev.shiftKey && ev.key === 'F') {
    ev.preventDefault();
    formatEditor(ed);
    return;
  }

  if (ev.key === 'Tab') {
    ev.preventDefault();
    const s = ta.selectionStart, en = ta.selectionEnd;
    if (s === en) {
      insert(ta, s, en, '  ');
    } else {
      const before = ta.value.substring(0, s);
      const indented = ta.value.substring(s, en).replace(/^/gm, '  ');
      const after = ta.value.substring(en);
      ta.value = before + indented + after;
      ta.selectionStart = s;
      ta.selectionEnd   = s + indented.length;
    }
    syncHighlight(ed); syncLineNums(ed);
    return;
  }

  if (ev.key === 'Enter') {
    const pos     = ta.selectionStart;
    const before  = ta.value.substring(0, pos);
    const lastNL  = before.lastIndexOf('\n');
    const indent  = before.substring(lastNL + 1).match(/^(\s*)/)[1];
    if (indent.length > 0) {
      ev.preventDefault();
      insert(ta, pos, ta.selectionEnd, '\n' + indent);
      syncHighlight(ed); syncLineNums(ed);
    }
  }
}

function insert(ta, start, end, text) {
  ta.value = ta.value.substring(0, start) + text + ta.value.substring(end);
  ta.selectionStart = ta.selectionEnd = start + text.length;
}

const LS_KEY = 'codelab_v3_';

function saveCode() {
  try {
    editors.forEach(e => localStorage.setItem(LS_KEY + e.id, e.ta.value));
    const now = new Date();
    const t = now.toLocaleTimeString('it-IT', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
    document.getElementById('sb-save').textContent = 'salvato ' + t;
  } catch(_) {}
}

function loadCode(id) {
  try { return localStorage.getItem(LS_KEY + id); } catch(_) { return null; }
}

function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveCode, 1500);
}

function formatEditor(ed) {
  const orig = ed.ta.value;
  let formatted = orig;
  try {
    if (ed.id === 'html') formatted = formatHTML(orig);
    if (ed.id === 'css')  formatted = formatCSS(orig);
    if (ed.id === 'js')   formatted = formatJS(orig);
  } catch(_) { return; } // se fallisce non tocca niente
  if (formatted !== orig) {
    ed.ta.value = formatted;
    syncHighlight(ed);
    syncLineNums(ed);
    updateLC(ed.id, ed.ta);
    scheduleSave();
  }
}

    .replace(/\s*{\s*/g, ' {\n')
    .replace(/\s*}\s*/g, '\n}\n')
    .replace(/;\s*/g, ';\n')
    .replace(/:\s+/g, ': ')
    .split('\n');

  for (let line of s) {
    line = line.trim();
    if (!line) continue;
    if (line === '}') indent = Math.max(0, indent - 1);
    out += '  '.repeat(indent) + line + '\n';
    if (line.endsWith('{')) indent++;
  }
  return out.trim();
}

/* ── Formattatore JS ── */
function formatJS(src) {
  let out = '', indent = 0;
  // indentazione basata su { } — non è un parser completo ma funziona bene per casi tipici
  const tokens = src
    .replace(/\/\*[\s\S]*?\*\//g, m => m)      // mantieni commenti blocco
    .replace(/\/\/[^\n]*/g, m => m)               // mantieni commenti riga
    .replace(/\s*{\s*/g, ' {\n')
    .replace(/\s*}\s*;?/g, m => '\n}' + (m.includes(';') ? ';' : '') + '\n')
    .replace(/;(?!\n)/g, ';\n')
    .split('\n');

  for (let line of tokens) {
    line = line.trim();
    if (!line) continue;
    const closes = (line.match(/}/g) || []).length;
    const opens  = (line.match(/{/g)  || []).length;
    // de-indenta prima se la riga inizia con }
    if (line.startsWith('}')) indent = Math.max(0, indent - 1);
    out += '  '.repeat(indent) + line + '\n';
    indent = Math.max(0, indent + opens - closes);
    if (line.startsWith('}') && opens > closes) indent++;
  }
  return out.trim();
}

/* ── Formattatore HTML ── */
function formatHTML(src) {
  const VOID = new Set(['area','base','br','col','embed','hr','img','input','link','meta','param','source','track','wbr']);
  let out = '', indent = 0;
  // divide in token (tag + testo)
  const parts = src.split(/(<[^>]+>)/g);
  for (let part of parts) {
    part = part.trim();
    if (!part) continue;
    if (part.startsWith('<\!--')) {
      out += '  '.repeat(indent) + part + '\n';
    } else if (part.startsWith('</')) {
      indent = Math.max(0, indent - 1);
      out += '  '.repeat(indent) + part + '\n';
    } else if (part.startsWith('<')) {
      const tag = (part.match(/<([a-zA-Z][^\s/>]*)/) || [])[1] || '';
      out += '  '.repeat(indent) + part + '\n';
      if (!VOID.has(tag.toLowerCase()) && !part.endsWith('/>')) indent++;
    } else {
      // testo
      const lines = part.split('\n').map(l => l.trim()).filter(Boolean);
      for (const l of lines) out += '  '.repeat(indent) + l + '\n';
    }
  }
  return out.trim();
}

/* ══ PREVIEW ══ */
function getCode() {
  return { html: editors[0].ta.value, css: editors[1].ta.value, js: editors[2].ta.value };
}

function buildDoc(c) {
  // inietta listener errori JS nel iframe
  const errListener = `
<script>
window.onerror = function(msg, src, line, col, err) {
  window.parent.postMessage({type:'jsError', msg: msg, line: line, col: col}, '*');
  return true;
};
window.addEventListener('unhandledrejection', function(e) {
  window.parent.postMessage({type:'jsError', msg: String(e.reason), line: 0, col: 0}, '*');
});
<\/script>`;
  return `<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<style>${c.css}</style>
</head>
<body>
${c.html}
${errListener}
<script>${c.js}<\/script>
</body>
</html>`;
}

function runPreview() {
  clearErrors();
  setStatus('aggiornamento…');
  const blob = new Blob([buildDoc(getCode())], { type: 'text/html' });
  const url  = URL.createObjectURL(blob);
  frame.src  = url;
  frame.onload = () => {
    if (lastBlobUrl) URL.revokeObjectURL(lastBlobUrl);
    lastBlobUrl = url;
    setStatus('pronto');
  };
}

function scheduleRun() {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(runPreview, 650);
}

/* ══ PANNELLO ERRORI JS ══ */
const errPanel = document.getElementById('error-panel');
const errList  = document.getElementById('error-list');
const errCount = document.getElementById('err-count');
let errors = [];

window.addEventListener('message', ev => {
  if (ev.data && ev.data.type === 'jsError') {
    addError(ev.data.msg, ev.data.line, ev.data.col);
  }
});

function addError(msg, line, col) {
  errors.push({ msg, line, col });
  renderErrors();
}

function renderErrors() {
  errCount.textContent = errors.length;
  errList.innerHTML = errors.map(err => `
    <div class="err-item">
      <span class="err-icon">&#9888;</span>
      <span class="err-msg">${escHtml(err.msg)}</span>
      ${err.line ? `<span class="err-line">riga ${err.line}</span>` : ''}
    </div>`).join('');
  errPanel.className = errors.length > 0 ? 'has-errors' : '';
}

function clearErrors() {
  errors = [];
  errList.innerHTML = '';
  errCount.textContent = '0';
  errPanel.className = '';
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ══ STATUS ══ */
function setStatus(msg) { document.getElementById('sb-status').textContent = msg; }

/* ══ LAYOUT ══ */
function setLayout(mode) {
  document.getElementById('main').className = 'layout-' + mode;
  currentLayout = mode;
  document.getElementById('btn-layout-h').classList.toggle('active', mode === 'h');
  document.getElementById('btn-layout-v').classList.toggle('active', mode === 'v');
  document.getElementById('resize-handle').style.display = mode === 'v' ? 'none' : '';
  try { localStorage.setItem('cl_layout', mode); } catch(_){}
}

/* ══ RESIZE ══ */
(function() {
  const handle   = document.getElementById('resize-handle');
  const main     = document.getElementById('main');
  const editWrap = document.getElementById('editors');
  const rightCol = document.getElementById('right-col');
  let dragging = false, startX, startW;
  handle.addEventListener('mousedown', e => {
    if (currentLayout !== 'h') return;
    dragging = true; startX = e.clientX;
    startW = editWrap.getBoundingClientRect().width;
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
  });
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const total = main.getBoundingClientRect().width - handle.offsetWidth;
    const newW  = Math.min(Math.max(startW + e.clientX - startX, 160), total - 160);
    editWrap.style.flex  = 'none';
    editWrap.style.width = newW + 'px';
    rightCol.style.flex  = '1';
  });
  document.addEventListener('mouseup', () => {
    if (dragging) { dragging = false; document.body.style.cursor = ''; document.body.style.userSelect = ''; }
  });
})();

/* ══ DOWNLOAD ══ */
function downloadFile(type) {
  document.getElementById('dl-menu').classList.remove('open');
  const c = getCode();
  const map = {
    html: [c.html, 'index.html', 'text/html'],
    css:  [c.css,  'style.css',  'text/css'],
    js:   [c.js,   'script.js',  'text/javascript'],
    all:  [buildDocClean(c), 'progetto.html', 'text/html'],
  };
  const [content, filename, mime] = map[type];
  triggerDownload(content, filename, mime);
}

function buildDocClean(c) {
  return `<!DOCTYPE html>\n<html lang="it">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width,initial-scale=1.0">\n<style>${c.css}</style>\n</head>\n<body>\n${c.html}\n<script>${c.js}<\/script>\n</body>\n</html>`;
}

function triggerDownload(content, filename, mime) {
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(new Blob([content], { type: mime + ';charset=utf-8' })),
    download: filename
  });
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  showToast('\u2713 ' + filename + ' scaricato');
}

/* ══ ZIP ══ */
function downloadZip() {
  document.getElementById('dl-menu').classList.remove('open');
  showToast('\u23F3 preparazione ZIP\u2026');
  const c = getCode();
  const files = [
    { name: 'index.html', content: buildHtmlLinks(c) },
    { name: 'style.css',  content: c.css },
    { name: 'script.js',  content: c.js  },
  ];
  const zip = buildZip(files);
  const a   = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(new Blob([zip], { type: 'application/zip' })),
    download: 'progetto-codelab.zip'
  });
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  showToast('\u2713 ZIP scaricato');
}

function buildHtmlLinks(c) {
  return `<!DOCTYPE html>\n<html lang="it">\n<head>\n<meta charset="UTF-8">\n<title>Progetto CodeLab</title>\n<link rel="stylesheet" href="style.css">\n</head>\n<body>\n${c.html}\n<script src="script.js"><\/script>\n</body>\n</html>`;
}

function buildZip(files) {
  const enc=new TextEncoder(), entries=[], cd=[];
  let off=0;
  for (const f of files) {
    const nb=enc.encode(f.name), db=enc.encode(f.content), crc=crc32(db);
    const now=new Date();
    const dd=((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate();
    const dt=(now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1);
    const lh=new Uint8Array(30+nb.length), lv=new DataView(lh.buffer);
    lv.setUint32(0,0x04034b50,true);lv.setUint16(4,20,true);lv.setUint16(6,0,true);lv.setUint16(8,0,true);
    lv.setUint16(10,dt,true);lv.setUint16(12,dd,true);lv.setUint32(14,crc>>>0,true);
    lv.setUint32(18,db.length,true);lv.setUint32(22,db.length,true);
    lv.setUint16(26,nb.length,true);lv.setUint16(28,0,true);lh.set(nb,30);
    entries.push(lh,db);
    const ce=new Uint8Array(46+nb.length), cv=new DataView(ce.buffer);
    cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);
    cv.setUint16(8,0,true);cv.setUint16(10,0,true);cv.setUint16(12,dt,true);cv.setUint16(14,dd,true);
    cv.setUint32(16,crc>>>0,true);cv.setUint32(20,db.length,true);cv.setUint32(24,db.length,true);
    cv.setUint16(28,nb.length,true);cv.setUint32(42,off,true);ce.set(nb,46);
    cd.push(ce); off+=30+nb.length+db.length;
  }
  const cdOff=off, cdSz=cd.reduce((a,b)=>a+b.length,0);
  const eocd=new Uint8Array(22), ev=new DataView(eocd.buffer);
  ev.setUint32(0,0x06054b50,true);ev.setUint16(8,files.length,true);ev.setUint16(10,files.length,true);
  ev.setUint32(12,cdSz,true);ev.setUint32(16,cdOff,true);
  const parts=[...entries,...cd,eocd];
  const out=new Uint8Array(parts.reduce((a,b)=>a+b.length,0));
  let p=0; for(const x of parts){out.set(x,p);p+=x.length;} return out;
}

function crc32(d) {
  const t=new Uint32Array(256);
  for(let i=0;i<256;i++){let v=i;for(let j=0;j<8;j++)v=(v&1)?(0xEDB88320^(v>>>1)):(v>>>1);t[i]=v;}
  let c=0xFFFFFFFF;
  for(let i=0;i<d.length;i++)c=t[(c^d[i])&0xFF]^(c>>>8);
  return(c^0xFFFFFFFF);
}

function showToast(msg) {
  const el = document.getElementById('toast');

}

  const e = editors.find(x => x.id === 'html');
